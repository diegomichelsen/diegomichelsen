    <circle class="port" cx="1114" cy="197" r="3.6"/>
    <g class="done">
      <rect x="1004" y="316" width="230" height="30" rx="15" fill="#0F2A2A" stroke="#1F5A4E"/>
      <circle cx="1022" cy="331" r="4" fill="#4ADE9B"/>
