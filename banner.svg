<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="Diego Michelsen, automação e integrações de sistemas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1424"/>
      <stop offset="1" stop-color="#0F1E36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#1D4E73" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1D4E73" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeTop" x1="0" x2="1">
      <stop offset="0" stop-color="#5EC8E5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5EC8E5" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5EC8E5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#24385A"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="380" fill="url(#fade)"/></mask>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="380" rx="16"/></clipPath>
    <style>
      .name   { font: 700 60px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #EEF3F9; letter-spacing: -1.5px; }
      .role   { font: 600 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8FD3EC; }
      .pitch  { font: 400 17px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8296B3; }
      .chip   { fill: #12223A; stroke: #26405F; stroke-width: 1; }
      .chipT  { font: 600 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #C9D6E6; }
      .chipN  { font: 700 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #F2B84B; }
      .node   { fill: #111F35; stroke: #2B4263; stroke-width: 1.4; }
      .nTitle { font: 600 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #E2EAF4; }
      .nSub   { font: 400 11px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #7186A4; }
      .iconBg { fill: #17304D; }
      .icon   { fill: none; stroke: #8FD3EC; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .edge   { fill: none; stroke: #2A4466; stroke-width: 1.6; }
      .port   { fill: #0A1424; stroke: #5EC8E5; stroke-width: 1.4; }
      .status { font: 500 12.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9FB2CB; }
      .comet  { fill: none; stroke: #8FE3FF; stroke-width: 2.6; stroke-linecap: round;
                stroke-dasharray: 9 91; stroke-dashoffset: 9; animation: travel 4.2s linear infinite; }
      .cometGlow { stroke: #5EC8E5; stroke-width: 8; opacity: .45; filter: url(#soft); }
      @keyframes travel { 0% { stroke-dashoffset: 9; } 80% { stroke-dashoffset: -91; } 100% { stroke-dashoffset: -91; } }
      .lit { animation: lit 4.2s ease-out infinite; }
      @keyframes lit { 0% { stroke: #2B4263; } 4% { stroke: #8FE3FF; } 22% { stroke: #2B4263; } 100% { stroke: #2B4263; } }
      .d1 { animation-delay: 0s; }   .d2 { animation-delay: .9s; }
      .d3 { animation-delay: 2.0s; } .d4 { animation-delay: 3.25s; }
      .done { opacity: 0; animation: done 4.2s ease-out infinite; }
      @keyframes done { 0%, 76% { opacity: 0; } 82%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .comet, .lit, .done { animation: none; }
        .comet { display: none; }
        .done { opacity: 1; }
      }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <rect width="1280" height="380" fill="url(#glow)"/>
    <rect width="1280" height="380" fill="url(#dots)" mask="url(#gridMask)"/>
    <rect x="0" y="0" width="1280" height="1.2" fill="url(#edgeTop)"/>
    <text x="64" y="152" class="name">Diego Michelsen</text>
    <text x="66" y="194" class="role">Automação e integrações de sistemas</text>
    <text x="66" y="232" class="pitch">Conecto sistemas, dados e IA para eliminar</text>
    <text x="66" y="256" class="pitch">trabalho manual da operação.</text>
    <g>
      <rect class="chip" x="64" y="290" width="215" height="34" rx="17"/>
      <text x="82" y="312" class="chipN">10+</text>
      <text x="117" y="312" class="chipT">anos em Operações</text>
      <rect class="chip" x="291" y="290" width="210" height="34" rx="17"/>
      <text x="309" y="312" class="chipN">~90%</text>
      <text x="357" y="312" class="chipT">QA automatizado</text>
      <rect class="chip" x="513" y="290" width="112" height="34" rx="17"/>
      <text x="531" y="312" class="chipN">5</text>
      <text x="546" y="312" class="chipT">projetos</text>
    </g>
