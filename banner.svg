    <text x="864" y="256" class="nTitle">Python</text>
    <text x="864" y="272" class="nSub">regras</text>
    <rect class="node lit d3" x="968" y="110" width="120" height="50" rx="11"/>
    <rect class="iconBg" x="978" y="123" width="24" height="24" rx="7"/>
    <ellipse class="icon" cx="990" cy="129.5" rx="6" ry="2.4"/>
    <path class="icon" d="M984 129.5 V140.5 C984 143.7 996 143.7 996 140.5 V129.5 M984 135 C984 138.2 996 138.2 996 135"/>
    <text x="1010" y="132" class="nTitle">BigQuery</text>
    <text x="1010" y="148" class="nSub">dados</text>
