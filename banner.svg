    <rect class="iconBg" x="978" y="247" width="24" height="24" rx="7"/>
    <path class="icon" d="M990 251.5 C991 256.5 992.5 258 997.5 259 C992.5 260 991 261.5 990 266.5 C989 261.5 987.5 260 982.5 259 C987.5 258 989 256.5 990 251.5 Z"/>
    <text x="1010" y="256" class="nTitle">LLM</text>
    <text x="1010" y="272" class="nSub">análise</text>
    <rect class="node lit d4" x="1114" y="172" width="120" height="50" rx="11"/>
