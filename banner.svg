    <path d="M796 197 C809 197 809 259 822 259 L968 259 C1028 259 1028 259 1088 259 C1101 259 1101 197 1114 197" class="comet cometGlow" pathLength="100"/>
    <path d="M796 197 C809 197 809 135 822 135 L968 135 C1028 135 1028 135 1088 135 C1101 135 1101 197 1114 197" class="comet" pathLength="100"/>
    <path d="M796 197 C809 197 809 259 822 259 L968 259 C1028 259 1028 259 1088 259 C1101 259 1101 197 1114 197" class="comet" pathLength="100"/>
    <rect class="node lit d1" x="676" y="172" width="120" height="50" rx="11"/>
    <rect class="iconBg" x="686" y="185" width="24" height="24" rx="7"/>
    <path class="icon" d="M700 189 L694 198 L699 198 L696 205 L703 195 L698 195 Z"/>
    <text x="718" y="194" class="nTitle">Webhook</text>
    <text x="718" y="210" class="nSub">gatilho</text>
    <rect class="node lit d2" x="822" y="110" width="120" height="50" rx="11"/>
    <rect class="iconBg" x="832" y="123" width="24" height="24" rx="7"/>
    <circle class="icon" cx="838.5" cy="135" r="2.6"/><circle class="icon" cx="849.5" cy="129" r="2.6"/><circle class="icon" cx="849.5" cy="141" r="2.6"/>
    <path class="icon" d="M841 134 L847 130 M841 136 L847 140"/>
    <text x="864" y="132" class="nTitle">n8n</text>
    <text x="864" y="148" class="nSub">orquestração</text>
